name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://natan10.github.io
      - name: Test static export
        run: npm test
        env:
          PLAYWRIGHT_USE_EXISTING_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: https://natan10.github.io
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
